  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    :root {
      --bg: #07080F;
      --bg2: #0D0F1C;
      --bg3: #111827;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.12);
      --text: #F1F5F9;
      --text2: #94A3B8;
      --text3: #475569;
      --purple: #6C63FF;
      --pink: #EC4899;
      --orange: #F7971E;
      --cyan: #06B6D4;
      --green: #10B981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    ::-webkit-scrollbar {
      width: 5px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 99px
    }

    input[type=range] {
      -webkit-appearance: none;
      height: 5px;
      border-radius: 99px;
      background: #1E293B;
      outline: none;
      cursor: pointer;
      width: 100%
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C63FF, #EC4899);
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.2), 0 4px 12px rgba(108, 99, 255, 0.5)
    }

    /* ── Keyframes ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(32px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(-2deg)
      }

      50% {
        transform: translateY(-16px) rotate(2deg)
      }
    }

    @keyframes spinSlow {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes gradShift {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    @keyframes blob1 {

      0%,
      100% {
        border-radius: 60% 40% 70% 30%/50% 60% 40% 70%;
        transform: translate(0, 0)
      }

      33% {
        border-radius: 40% 60% 30% 70%/60% 40% 70% 30%;
        transform: translate(20px, -15px)
      }

      66% {
        border-radius: 70% 30% 50% 50%/30% 70% 60% 40%;
        transform: translate(-10px, 10px)
      }
    }

    @keyframes blob2 {

      0%,
      100% {
        border-radius: 40% 60% 60% 40%/60% 30% 70% 40%;
        transform: translate(0, 0)
      }

      33% {
        border-radius: 60% 40% 40% 60%/40% 60% 30% 70%;
        transform: translate(-20px, 15px)
      }

      66% {
        border-radius: 30% 70% 70% 30%/70% 30% 50% 50%;
        transform: translate(15px, -10px)
      }
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(0.5)
      }

      50% {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes scanLine {
      0% {
        transform: translateY(-100%)
      }

      100% {
        transform: translateY(100vh)
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(108, 99, 255, 0.3)
      }

      50% {
        box-shadow: 0 0 40px rgba(108, 99, 255, 0.6), 0 0 80px rgba(108, 99, 255, 0.2)
      }
    }

    @keyframes borderGlow {

      0%,
      100% {
        border-color: rgba(108, 99, 255, 0.3)
      }

      50% {
        border-color: rgba(236, 72, 153, 0.5)
      }
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: scale(0.7)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes ripple {
      0% {
        transform: scale(0);
        opacity: 1
      }

      100% {
        transform: scale(4);
        opacity: 0
      }
    }

    .fade-up {
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both
    }

    .fade-in {
      animation: fadeIn 0.5s ease both
    }

    /* ── Gradient text ── */
    .grad {
      background: linear-gradient(135deg, #6C63FF, #EC4899, #F7971E);
      background-size: 200% 200%;
      animation: gradShift 4s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    .grad2 {
      background: linear-gradient(90deg, #6C63FF, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    /* ── Glass ── */
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08)
    }

    .glass2 {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06)
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 500;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(7, 8, 15, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06)
    }

    @media(max-width:640px) {
      nav {
        padding: 0 16px
      }
    }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px 60px;
      position: relative;
      overflow: hidden
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(108, 99, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(108, 99, 255, 0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%)
    }

    /* ── Tool card ── */
    .tool-card {
      border-radius: 20px;
      padding: 28px 24px;
      cursor: pointer;
      text-align: left;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(255, 255, 255, 0.03);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      width: 100%;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1)
    }

    .tool-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--c, #6C63FF)08, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s
    }

    .tool-card:hover {
      transform: translateY(-6px);
      border-color: var(--c, #6C63FF);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--c, #6C63FF)22, 0 0 40px var(--c, #6C63FF)12
    }

    .tool-card:hover::before {
      opacity: 1
    }

    /* ── Pill ── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px
    }

    /* ── CTA button ── */
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 36px;
      border-radius: 99px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden
    }

    .cta-primary {
      background: linear-gradient(135deg, #6C63FF, #EC4899);
      color: #fff;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.4)
    }

    .cta-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(108, 99, 255, 0.6)
    }

    .cta-primary:disabled {
      background: #1E293B;
      color: #475569;
      cursor: not-allowed;
      box-shadow: none;
      transform: none
    }

    .cta-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text2);
      border: 1px solid rgba(255, 255, 255, 0.1)
    }

    .cta-ghost:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text)
    }

    /* ── Input ── */
    .inp {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s
    }

    .inp:focus {
      border-color: #6C63FF;
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15)
    }

    .inp::placeholder {
      color: var(--text3)
    }

    /* ── Status ── */
    .ok {
      padding: 13px 18px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34D399;
      font-weight: 600;
      font-size: 14px
    }

    .err {
      padding: 13px 18px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #F87171;
      font-weight: 600;
      font-size: 14px
    }

    .info {
      padding: 13px 18px;
      border-radius: 12px;
      background: rgba(108, 99, 255, 0.1);
      border: 1px solid rgba(108, 99, 255, 0.25);
      color: #A78BFA;
      font-weight: 600;
      font-size: 14px
    }

    /* ── Choice btn ── */
    .ch {
      flex: 1;
      padding: 12px 6px;
      border-radius: 12px;
      border: 1.5px solid;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s
    }

    /* ── Glow orb ── */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none
    }

    /* ── Section heading ── */
    .sec-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #6C63FF;
      display: block;
      margin-bottom: 10px
    }

    /* ── Stats ── */
    .stat {
      padding: 24px 32px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .stat::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.08), rgba(236, 72, 153, 0.05));
      border-radius: 20px
    }

    /* ── Footer ── */
    footer {
      background: #050609;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 72px 40px 36px
    }

    @media(max-width:640px) {
      footer {
        padding: 48px 20px 28px
      }
    }

    /* ── Scan line effect ── */
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(108, 99, 255, 0.4), transparent);
      animation: scanLine 6s linear infinite;
      pointer-events: none
    }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      color: var(--text2);
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 99px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      margin-bottom: 36px
    }

    .back-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05)
    }

    /* ── Particle dot ── */
    .dot {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #6C63FF;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) var(--delay, 0s) ease-in-out infinite
    }

    /* ── Feature badge ── */
    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07)
    }

    /* HERO IMPROVEMENTS */
    .hero {
      padding-top: 110px !important
    }

    .hero h1 {
      max-width: 900px !important;
      margin: 0 auto 24px !important;
      font-size: clamp(60px, 8vw, 100px) !important;
      line-height: .92 !important;
      letter-spacing: -4px !important;
      font-weight: 800 !important;
    }

    .hero p {
      max-width: 700px !important;
      margin: 0 auto 40px !important;
    }

    .hero input {
      max-width: 700px
    }

    .stat {
      min-width: 140px !important
    }


    .hero {
      min-height: 92vh !important;
      text-align: center !important
    }

    .hero h1 {
      font-family: 'Syne', sans-serif !important;
      font-size: clamp(36px, 7vw, 72px) !important;
      line-height: 1.06 !important;
      letter-spacing: -2.5px !important;
      max-width: 780px !important;
      margin: 0 auto 22px !important
    }

    .hero p {
      max-width: 540px !important;
      margin: 0 auto 40px !important;
      color: #475569 !important
    }
  </style>

    const { useState, useRef, useEffect, useCallback } = React;

    /* ── Helpers ── */
    function dl(bytes, name, mime = 'application/pdf') {
      const u = URL.createObjectURL(new Blob([bytes], { type: mime }));
      const a = Object.assign(document.createElement('a'), { href: u, download: name });
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(u); a.remove() }, 2000);
    }
    function readFile(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsArrayBuffer(f) }) }

    /* ── PDF Processors ── */
    async function doMerge(files) { const out = await PDFDocument.create(); for (const f of files) { const d = await PDFDocument.load(await readFile(f)); (await out.copyPages(d, d.getPageIndices())).forEach(p => out.addPage(p)) } return out.save() }
    async function doSplit(file, at) { const buf = await readFile(file); const src = await PDFDocument.load(buf); const total = src.getPageCount(); let b = at.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0 && n < total); b = [0, ...b, total]; const parts = []; for (let i = 0; i < b.length - 1; i++) { const d = await PDFDocument.create(); (await d.copyPages(src, Array.from({ length: b[i + 1] - b[i] }, (_, j) => b[i] + j))).forEach(p => d.addPage(p)); parts.push({ bytes: await d.save(), name: `split-part-${i + 1}.pdf` }) } return parts }
    async function doRotate(file, angle) { const d = await PDFDocument.load(await readFile(file)); d.getPages().forEach(p => p.setRotation(degrees((p.getRotation().angle + parseInt(angle)) % 360))); return d.save() }
    async function doWatermark(file, text, opacity) { const d = await PDFDocument.load(await readFile(file)); const font = await d.embedFont(StandardFonts.HelveticaBold); d.getPages().forEach(p => { const { width, height } = p.getSize(); const sz = Math.min(width, height) * 0.1; p.drawText(text, { x: width / 2 - font.widthOfTextAtSize(text, sz) / 2, y: height / 2 - sz / 2, size: sz, font, color: rgb(0.6, 0.6, 0.6), opacity: opacity / 100, rotate: degrees(-30) }) }); return d.save() }
    async function doPageNumbers(file, pos) { const d = await PDFDocument.load(await readFile(file)); const font = await d.embedFont(StandardFonts.Helvetica); d.getPages().forEach((p, i) => { const { width, height } = p.getSize(); const sz = 11; const tw = font.widthOfTextAtSize(`${i + 1}`, sz); const mg = 24; let x = pos.includes('left') ? mg : pos.includes('right') ? width - tw - mg : (width - tw) / 2; let y = pos.includes('top') ? height - mg - sz : mg; p.drawText(`${i + 1}`, { x, y, size: sz, font, color: rgb(0.4, 0.4, 0.4) }) }); return d.save() }
    async function doCompress(file, level) { const d = await PDFDocument.load(await readFile(file), { updateMetadata: false }); return d.save({ useObjectStreams: level !== 'low' }) }
    async function doConvertToImages(file) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; const pdf = await pdfjsLib.getDocument({ data: await readFile(file) }).promise; const imgs = []; for (let i = 1; i <= pdf.numPages; i++) { const pg = await pdf.getPage(i); const vp = pg.getViewport({ scale: 2 }); const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise; imgs.push({ url: cv.toDataURL('image/jpeg', 0.92), name: `page-${i}.jpg` }) } return imgs }
    async function doOCR(file, setSt) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; const pdf = await pdfjsLib.getDocument({ data: await readFile(file) }).promise; let text = ''; for (let i = 1; i <= pdf.numPages; i++) { setSt(`Extracting page ${i}/${pdf.numPages}…`); const c = await (await pdf.getPage(i)).getTextContent(); text += `\n─── Page ${i} ───\n` + c.items.map(it => it.str).join(' ') } return text.trim() || 'No selectable text found.' }
    async function doEdit(file, txt, col) { const d = await PDFDocument.load(await readFile(file)); const font = await d.embedFont(StandardFonts.Helvetica); const pg = d.getPage(0); const { height } = pg.getSize(); const [r, g, b] = col.match(/\w\w/g).map(x => parseInt(x, 16) / 255); pg.drawText(txt || 'Annotation', { x: 50, y: height - 60, size: 14, font, color: rgb(r, g, b) }); return d.save() }

    /* ── Tools config ── */
    const TOOLS = [
      { id: 'merge', icon: '🔗', label: 'Merge PDFs', desc: 'Combine multiple PDFs into one', color: '#6C63FF', cat: 'Organize' },
      { id: 'split', icon: '✂️', label: 'Split PDF', desc: 'Divide PDF into separate files', color: '#FF6584', cat: 'Organize' },

      { id: 'convert', icon: '🔄', label: 'PDF → JPG', desc: 'Convert each page to a JPG image', color: '#F7971E', cat: 'Convert' },
      { id: 'rotate', icon: '🔃', label: 'Rotate PDF', desc: 'Rotate pages to any angle', color: '#A855F7', cat: 'Organize' },
      { id: 'watermark', icon: '💧', label: 'Watermark', desc: 'Stamp text watermark on all pages', color: '#06B6D4', cat: 'Edit' },

      { id: 'sign', icon: '🖊️', label: 'Sign PDF', desc: 'Draw & embed your signature', color: '#EC4899', cat: 'Edit' },

      { id: 'ocr', icon: '🔍', label: 'Extract Text', desc: 'Extract selectable text from PDFs', color: '#F59E0B', cat: 'Convert' },
    ];
    const CATS = [...new Set(TOOLS.map(t => t.cat))];
    const CAT_ICONS = { Organize: '📁', Optimize: '⚡', Convert: '🔄', Edit: '✏️', Security: '🛡️' };

    /* ── SVG Logo ── */

    /* ── Particle background ── */
    function Particles() {
      const dots = Array.from({ length: 28 }, (_, i) => ({
        id: i, top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`,
        dur: `${2.5 + Math.random() * 4}s`, delay: `${Math.random() * 5}s`,

      }));
      return (
        <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
          {dots.map(d => (
            <div key={d.id} className="dot" style={{
              top: d.top, left: d.left, '--dur': d.dur, '--delay': d.delay,
              width: d.size, height: d.size, opacity: d.opacity,
              background: `hsl(${240 + Math.random() * 60},80%,75%)`
            }} />
          ))}
        </div>
      );

    /* ── Drop Zone ── */
    function DropZone({ onFiles, multiple, label, color = '#6C63FF' }) {
      const [drag, setDrag] = useState(false); const ref = useRef();
      const handle = f => { if (f.length) onFiles(multiple ? f : [f[0]]) };
      return (
        <div
          onDragOver={e => { e.preventDefault(); setDrag(true) }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); handle(Array.from(e.dataTransfer.files)) }}
          onClick={() => ref.current.click()}
          style={{
            border: `2px dashed ${drag ? color : 'rgba(255,255,255,0.12)'}`,
            borderRadius: 20, padding: '48px 28px', textAlign: 'center', cursor: 'pointer',
            background: drag ? `${color}0A` : 'rgba(255,255,255,0.02)',
            transition: 'all 0.3s', position: 'relative', overflow: 'hidden'
          }}>
          <input ref={ref} type="file" accept=".pdf,application/pdf" multiple={multiple}
            style={{ display: 'none' }} onChange={e => handle(Array.from(e.target.files))} />
          {drag && <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse at center,${color}15,transparent)`, pointerEvents: 'none' }} />}
          <div style={{ fontSize: 52, marginBottom: 14, filter: `drop-shadow(0 4px 12px ${color}60)` }}>📂</div>
          <div style={{ fontWeight: 700, fontSize: 17, color: '#F1F5F9', marginBottom: 6 }}>{label || 'Drop PDF here'}</div>
          <div style={{ fontSize: 13, color: '#475569', marginBottom: 20 }}>or click to browse from your device</div>
          <button style={{

            background: `linear-gradient(135deg,${color},#EC4899)`, color: '#fff', fontWeight: 700,
            fontSize: 13, cursor: 'pointer', boxShadow: `0 4px 20px ${color}40`
          }}>
            Choose File{multiple ? 's' : ''}
          </button>
        </div>
      );
    }

    /* ── Signature Pad ── */
    function SigPad({ onSave, color }) {
      const cv = useRef(); const [drawing, setDrawing] = useState(false); const last = useRef(null);
      const pos = e => { const r = cv.current.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return [s.clientX - r.left, s.clientY - r.top] };
      const start = e => { setDrawing(true); last.current = pos(e) };
      const move = e => { if (!drawing) return; const ctx = cv.current.getContext('2d'); const [x, y] = pos(e); ctx.strokeStyle = '#F1F5F9'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(...last.current); ctx.lineTo(x, y); ctx.stroke(); last.current = [x, y] };
      const end = () => setDrawing(false);
      const clear = () => cv.current.getContext('2d').clearRect(0, 0, cv.current.width, cv.current.height);
      return (
        <div>
          <div style={{ fontWeight: 600, fontSize: 13, color: '#94A3B8', marginBottom: 10 }}>Draw your signature below</div>
          <canvas ref={cv} width={520} height={140}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={e => { e.preventDefault(); start(e) }} onTouchMove={e => { e.preventDefault(); move(e) }} onTouchEnd={end}
            style={{
              border: '1.5px solid rgba(255,255,255,0.1)', borderRadius: 14, width: '100%', height: 140,
              cursor: 'crosshair', background: 'rgba(255,255,255,0.03)', touchAction: 'none', display: 'block'
            }} />
          <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
            <button onClick={clear} className="cta cta-ghost" style={{ flex: 1, padding: '10px', fontSize: 13 }}>🗑 Clear</button>
            <button onClick={() => onSave(cv.current.toDataURL('image/png'))}
              style={{
                flex: 2, padding: '10px', borderRadius: 12, border: 'none',
                background: `linear-gradient(135deg,${color},#A18CD1)`,
                color: '#fff', fontWeight: 700, fontSize: 13, cursor: 'pointer', fontFamily: 'Inter,sans-serif'
              }}>
              ✅ Use This Signature
            </button>
          </div>
        </div>
      );
    }

    /* ── Tool Panel ── */
    function ToolPanel({ tool, onBack }) {
      const [files, setFiles] = useState([]);
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState('');
      const [error, setError] = useState('');
      const [results, setResults] = useState([]);
      const [text, setText] = useState('');
      const [sigDone, setSigDone] = useState(false);
      const [s, setS] = useState({ password: '', confirm: '', waterText: 'CONFIDENTIAL', waterOpacity: 50, rotate: '90', splitPages: '', compress: 'medium', pagePos: 'bottom-center', ocrLang: 'eng', annotText: '', annotColor: '#FFD700' });
      const set = (k, v) => setS(p => ({ ...p, [k]: v }));
      const addFiles = f => setFiles(tool.id === 'merge' ? p => [...p, ...f] : f);
      const rm = i => setFiles(p => p.filter((_, j) => j !== i));

      const ch = (active, label, onClick) => (
        <button onClick={onClick} className="ch"
          style={{
            borderColor: active ? tool.color : 'rgba(255,255,255,0.1)',
            background: active ? `${tool.color}20` : 'rgba(255,255,255,0.03)',
            color: active ? tool.color : '#64748B'
          }}>
          {label}
        </button>
      );

      const run = async () => {
        if (!files.length) return;
        setBusy(true); setError(''); setResults([]); setText(''); setStatus('Processing…');
        try {
          switch (tool.id) {
            case 'merge': dl(await doMerge(files), 'merged.pdf'); setStatus('✅ Merged & downloaded!'); break;
            case 'split': { const ps = await doSplit(files[0], s.splitPages || ''); for (const p of ps) { dl(p.bytes, p.name); await new Promise(r => setTimeout(r, 400)) } setStatus(`✅ Split into ${ps.length} file${ps.length > 1 ? 's' : ''}!`); break }
            case 'compress': dl(await doCompress(files[0], s.compress), `compressed-${files[0].name}`); setStatus('✅ Compressed & downloaded!'); break;
            case 'rotate': dl(await doRotate(files[0], s.rotate), `rotated-${files[0].name}`); setStatus('✅ Rotated & downloaded!'); break;
            case 'watermark': dl(await doWatermark(files[0], s.waterText || 'WATERMARK', s.waterOpacity), `watermarked-${files[0].name}`); setStatus('✅ Watermark added & downloaded!'); break;
            case 'pageno': dl(await doPageNumbers(files[0], s.pagePos), `numbered-${files[0].name}`); setStatus('✅ Page numbers added & downloaded!'); break;
            case 'convert': { const imgs = await doConvertToImages(files[0]); setResults(imgs); setStatus(`✅ ${imgs.length} page${imgs.length > 1 ? 's' : ''} converted!`); break }
            case 'ocr': { const t = await doOCR(files[0], setStatus); setText(t); setStatus('✅ Text extracted!'); break }
            case 'edit': dl(await doEdit(files[0], s.annotText, s.annotColor), `annotated-${files[0].name}`); setStatus('✅ Annotation added & downloaded!'); break;
            case 'protect': setError('PDF encryption requires a server-side tool. Use ilovepdf.com or smallpdf.com.'); break;
            case 'unlock': setError('Removing encryption requires a server-side tool. Use ilovepdf.com or smallpdf.com.'); break;
            case 'sign': setError('Draw your signature above and click "Use This Signature".'); break;
            default: setError('Tool not yet implemented.');
          }
        } catch (e) { console.error(e); setError(e.message || 'Something went wrong.'); setStatus('') }
        setBusy(false);
      };

      const embedSig = async (dataUrl) => {
        if (!files.length) { setError('Upload a PDF first.'); return }
        setBusy(true); setStatus('Embedding signature…'); setError('');
        try {
          const d = await PDFDocument.load(await readFile(files[0]));
          const img = await d.embedPng(Uint8Array.from(atob(dataUrl.split(',')[1]), c => c.charCodeAt(0)));
          const pg = d.getPage(0); const { width, height } = pg.getSize();
          pg.drawImage(img, { x: width - 230, y: 30, width: 190, height: 65 });
          dl(await d.save(), `signed-${files[0].name}`);
          setStatus('✅ Signed & downloaded!'); setSigDone(true);
        } catch (e) { setError(e.message) }
        setBusy(false);
      };

      return (
        <div style={{ maxWidth: 600, margin: '0 auto' }}>
          <button className="back-btn" onClick={onBack}>← Back to all tools</button>

          {/* Tool hero header */}
          <div style={{
            borderRadius: 24, padding: '32px', marginBottom: 32, position: 'relative', overflow: 'hidden',
            background: `linear-gradient(135deg,${tool.color}18,rgba(255,255,255,0.02))`,
            border: `1px solid ${tool.color}30`
          }}>
            <div style={{
              position: 'absolute', top: -40, right: -40, width: 160, height: 160, borderRadius: '50%',
              background: `radial-gradient(circle,${tool.color}20,transparent 70%)`
            }} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
              <div style={{
                width: 72, height: 72, borderRadius: 22, background: `${tool.color}22`,
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 36, flexShrink: 0,
                boxShadow: `0 8px 32px ${tool.color}30,inset 0 1px 0 rgba(255,255,255,0.1)`
              }}>
                {tool.icon}
              </div>
              <div>
                <span style={{
                  fontSize: 10, fontWeight: 800, letterSpacing: 2, color: tool.color,
                  textTransform: 'uppercase', display: 'block', marginBottom: 6
                }}>{tool.cat}</span>
                <h2 style={{ fontFamily: 'Syne,Inter,sans-serif', margin: 0, fontWeight: 800, fontSize: 26, color: '#F1F5F9', lineHeight: 1.1 }}>{tool.label}</h2>
                <p style={{ margin: '6px 0 0', color: '#64748B', fontSize: 14 }}>{tool.desc}</p>
              </div>
            </div>
          </div>

          <DropZone onFiles={addFiles} multiple={tool.id === 'merge'} color={tool.color}
            label={tool.id === 'merge' ? 'Drop multiple PDFs to merge' : 'Drop your PDF here'} />

          {files.length > 0 && (
            <div style={{ marginTop: 14, display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {files.map((f, i) => (
                <div key={i} style={{
                  display: 'flex', alignItems: 'center', gap: 8, padding: '8px 14px',
                  borderRadius: 99, background: `${tool.color}15`, border: `1px solid ${tool.color}30`
                }}>
                  <span>📄</span>
                  <span style={{
                    fontSize: 13, fontWeight: 600, color: '#C4B5FD', maxWidth: 140,
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'
                  }}>{f.name}</span>
                  <span style={{ fontSize: 11, color: '#475569' }}>{(f.size / 1024).toFixed(0)}KB</span>
                  <button onClick={() => rm(i)} style={{
                    border: 'none', background: 'none', cursor: 'pointer',
                    color: '#475569', fontSize: 14, padding: 0, lineHeight: 1
                  }}>✕</button>
                </div>
              ))}
            </div>
          )}

          {/* Settings */}
          <div style={{ marginTop: 28 }}>
            {tool.id === 'merge' && files.length > 1 && (
              <div style={{ borderRadius: 16, padding: 20, background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.07)' }}>
                <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.5, color: tool.color, textTransform: 'uppercase', marginBottom: 14 }}>Merge Order ({files.length} files)</div>
                {files.map((f, i) => (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px',
                    borderRadius: 12, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.06)', marginBottom: 8
                  }}>
                    <span style={{ width: 24, height: 24, borderRadius: 8, background: tool.color + '30', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 800, color: tool.color, flexShrink: 0 }}>{i + 1}</span>
                    <span style={{ fontSize: 16 }}>📄</span>
                    <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: '#CBD5E1', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</span>
                    <button onClick={() => rm(i)} style={{ border: 'none', background: 'rgba(255,255,255,0.05)', cursor: 'pointer', color: '#64748B', fontSize: 13, padding: '4px 8px', borderRadius: 6 }}>✕</button>
                  </div>
                ))}
              </div>
            )}

            {tool.id === 'split' && (
              <div>
                <label style={{ display: 'block', fontWeight: 700, fontSize: 13, color: '#94A3B8', marginBottom: 8 }}>Split at page numbers (e.g. 3,6)</label>
                <input className="inp" type="text" placeholder="3,6 — leave blank to split every page" value={s.splitPages} onChange={e => set('splitPages', e.target.value)} />
              </div>
            )}

            {tool.id === 'compress' && (
              <div>
                <div style={{ fontWeight: 700, fontSize: 13, color: '#94A3B8', marginBottom: 12 }}>Compression Level</div>
                <div style={{ display: 'flex', gap: 10 }}>
                  {ch(s.compress === 'low', '🟡 Low', () => set('compress', 'low'))}
                  {ch(s.compress === 'medium', '🟠 Medium', () => set('compress', 'medium'))}
                  {ch(s.compress === 'high', '🔴 High', () => set('compress', 'high'))}
                </div>
                <div style={{ marginTop: 12, padding: '11px 16px', borderRadius: 12, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', fontSize: 12, color: '#64748B' }}>
                  {s.compress === 'low' ? 'Minimal compression — best visual quality' : s.compress === 'medium' ? 'Balanced size & quality (recommended)' : 'Maximum compression — smallest possible file'}
                </div>
              </div>
            )}

            {tool.id === 'rotate' && (
              <div>
                <div style={{ fontWeight: 700, fontSize: 13, color: '#94A3B8', marginBottom: 12 }}>Rotation Angle</div>
                <div style={{ display: 'flex', gap: 10 }}>
                  {['90', '180', '270', '-90'].map(d => ch(s.rotate === d, d + '°', () => set('rotate', d)))}
                </div>
                <div style={{
                  textAlign: 'center', marginTop: 20, fontSize: 48, filter: `drop-shadow(0 8px 20px ${tool.color}50)`,
                  transform: `rotate(${s.rotate}deg)`, transition: 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)', display: 'inline-block', width: '100%'
                }}>
                  📄
                </div>
              </div>
            )}

            {tool.id === 'watermark' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
                <div>
                  <label style={{ display: 'block', fontWeight: 700, fontSize: 13, color: '#94A3B8', marginBottom: 8 }}>Watermark Text</label>

                  <div style={{ maxWidth: 960, margin: '0 auto', display: 'flex', flexWrap: 'wrap', gap: 14, justifyContent: 'center' }}>
                    {[['🔒', '256-bit SSL Encrypted'], ['🚫', 'Files Never Uploaded'], ['🗑️', 'Auto-Deleted Locally'], ['⚡', 'Instant Processing'], ['🌐', 'Any Browser'], ['🆓', 'Always Free'], ['📱', 'Mobile Friendly'], ['🔕', 'No Account Needed']].map(([ic, tx], i) => (
                      <div key={i} className="badge">
                        <span style={{ fontSize: 20 }}>{ic}</span>
                        <span style={{ fontSize: 13, fontWeight: 600, color: '#475569' }}>{tx}</span>
                      </div>
                    ))}
                  </div>
                </section>
              </>
            ) : (
              <div style={{ maxWidth: 1160, margin: '0 auto', padding: '104px 20px 80px' }}>
                <ToolPanel tool={active} onBack={() => setActive(null)} />
              </div>
            )}
          </main>

          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
